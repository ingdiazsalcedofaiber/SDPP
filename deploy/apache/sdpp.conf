# SDPP — Apache reverse proxy for Windows Server (intranet entry point)
#
# Sits IN FRONT of the existing, already-tested stack — it does not replace nginx (still serves the
# built frontend SPA) or the Gateway/YARP (still owns API routing, CORS, rate limiting, auth). Apache
# is the single thing the intranet actually talks to; everything behind it stays on localhost.
#
#   Browser --https--> Apache :443 --> nginx :5090 (frontend, path /)
#                                  \-> Gateway :5080 (API, path /api)
#
# Required modules (enable with `httpd -M` to confirm, or Apache's own module-enable mechanism on
# Windows — there is no a2enmod on Windows Apache, edit httpd.conf's LoadModule lines directly):
#   mod_proxy, mod_proxy_http, mod_ssl, mod_headers, mod_rewrite, mod_deflate, mod_setenvif
#
# Replace ssl_cert.crt / ssl_cert.key with the certificate issued by the internal PKI — never a
# public CA for an intranet-only host, and never a self-signed cert left in place beyond initial
# bring-up.

# --- Plain HTTP: redirect to HTTPS, nothing else served here ---
<VirtualHost *:80>
    ServerName sdpp.intranet
    Redirect permanent / https://sdpp.intranet/
</VirtualHost>

<VirtualHost *:443>
    ServerName sdpp.intranet

    SSLEngine on
    SSLCertificateFile      "C:/SDPP/certs/sdpp.intranet.crt"
    SSLCertificateKeyFile   "C:/SDPP/certs/sdpp.intranet.key"
    # SSLCertificateChainFile "C:/SDPP/certs/sdpp.intranet.chain.crt"   # if the internal CA issues one
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder     on

    # --- Never let Apache itself serve or reveal these, no matter what proxied paths exist ---
    <LocationMatch "(^|/)\.(env|git)|/node_modules/|/logs/">
        Require all denied
    </LocationMatch>

    # --- Request limits / timeouts ---
    # 200 MB matches Documents.Api/Gateway's own raised Kestrel limit (see their Program.cs) —
    # keeping these in sync is deliberate: whichever is smaller silently wins, so a mismatch here
    # would re-introduce the exact "large PDF upload rejected" problem that raising Kestrel fixed.
    LimitRequestBody 209715200
    Timeout 120
    ProxyTimeout 120

    # --- Compression (text/JSON responses; PDFs and images are already compressed formats) ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json
    </IfModule>

    # --- Security headers. HSTS lives here because Apache is where TLS actually terminates; the
    # rest deliberately overwrite (not append) whatever the proxied services already set, so a
    # response is never left with two conflicting copies of the same header. ---
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    ProxyPreserveHost on
    ProxyRequests off

    # --- API — everything under /api goes to the Gateway (YARP), which owns auth/CORS/rate
    # limiting/routing to the 5 backend services. Apache never talks to those 5 services directly. ---
    ProxyPass        /api http://127.0.0.1:5080/api
    ProxyPassReverse /api http://127.0.0.1:5080/api

    # --- Frontend — everything else goes to nginx, which already serves the built SPA with its own
    # tuned config (SPA fallback, pdf.js worker MIME fix, asset caching — see
    # frontend/sdpp-web/nginx.conf). Apache does not re-implement any of that. ---
    ProxyPass        / http://127.0.0.1:5090/
    ProxyPassReverse / http://127.0.0.1:5090/

    ErrorLog  "C:/SDPP/logs/apache/sdpp-error.log"
    CustomLog "C:/SDPP/logs/apache/sdpp-access.log" combined
</VirtualHost>
