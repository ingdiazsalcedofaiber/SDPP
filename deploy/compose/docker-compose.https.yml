# HTTPS local para pruebas en red (necesario para que "Continuar con Google" funcione desde algo
# que no sea localhost — Google exige HTTPS en cualquier origen que no sea localhost/127.0.0.1).
# Uso:
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.https.yml up -d web
#
# Solo monta una configuración de nginx distinta (con un segundo server block HTTPS) y el
# certificado autofirmado (certs/dev-cert.pem, ver ese directorio) — no reconstruye la imagen web.
# El navegador de quien lo abra va a mostrar una advertencia de certificado no confiable la primera
# vez (es autofirmado, no pertenece a ninguna autoridad certificadora) — "Avanzado" -> "Continuar"
# y ya, eso no afecta que Google acepte el origen como HTTPS válido.

services:
  web:
    volumes:
      - ./nginx-dev-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "5443:8443"
