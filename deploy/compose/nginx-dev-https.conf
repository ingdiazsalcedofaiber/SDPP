# Dev-only variant of frontend/sdpp-web/nginx.conf — adds an HTTPS server block (self-signed cert,
# see certs/dev-cert.pem) alongside the normal HTTP one, so a colleague on the same LAN can reach
# the app over https://<tu-ip>:5443 and Google Sign-In's OAuth origin check (which requires HTTPS
# for anything other than localhost/127.0.0.1) actually passes. Mounted in place of the image's
# baked-in default.conf only when docker-compose.https.yml is also given — the production/default
# nginx.conf this was copied from is untouched. Keep the two server blocks' location rules in sync
# by hand if that file changes (duplicated here rather than shared via `include`, to keep this one
# file self-contained and easy to delete once real HTTPS/a real domain exists in production).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location ~ \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 8443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/dev-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location ~ \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
