server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback — React Router owns client-side routing (see src/app/router.tsx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # vite-plugin-pwa's generated files — must NEVER be cached far-future like /assets/, or an
    # updated service worker (and the app update it delivers) could get stuck on a client
    # indefinitely. Workbox's own precached, content-hashed assets are covered by /assets/ above.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /manifest.webmanifest {
        # nginx's stock mime.types has no entry for .webmanifest either (same class of gap as the
        # .mjs fix above) — without this it falls back to application/octet-stream, which Chrome
        # tolerates today but isn't the spec-correct type, so fix it the same way.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # nginx's stock mime.types has no entry for .mjs (ES module scripts) — pdfjs-dist ships its
    # worker as pdf.worker.min.mjs, and without this it falls back to application/octet-stream,
    # which the browser's strict MIME checking (required for `type="module"` workers) refuses to
    # execute, silently breaking the PDF viewer with no error the user can act on.
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
