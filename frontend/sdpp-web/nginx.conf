server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback — React Router owns client-side routing (see src/app/router.tsx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's stock mime.types has no entry for .mjs (ES module scripts) — pdfjs-dist ships its
    # worker as pdf.worker.min.mjs, and without this it falls back to application/octet-stream,
    # which the browser's strict MIME checking (required for `type="module"` workers) refuses to
    # execute, silently breaking the PDF viewer with no error the user can act on.
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
